name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: tgproxy_gui-windows.exe
            args: --onefile --windowed --name tgproxy_gui
          - os: ubuntu-latest
            artifact: tgproxy_gui-linux
            args: --onefile --name tgproxy_gui
          - os: macos-latest
            artifact: tgproxy_gui-macos
            args: --onefile --name tgproxy_gui
    runs-on: ${{ matrix.os }}
    # страховка: фатал до старта приложения иначе ждал бы дефолтных 360 минут,
    # самому долгому прогону матрицы 30 минут хватает с запасом
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "mtproxy-checker @ git+https://github.com/alimghmi/mtproxychecker.git" pyinstaller
      # github.ref_name - тег vX.Y.Z; теги пушат только обладатели write на репо,
      # то есть тот же круг, что и правящие этот workflow: нового вектора нет.
      - name: Внедрить версию из тега
        run: python ci/set_version.py ${{ github.ref_name }}
      # тесты этого коммита уже прогнал workflow tests (обе джобы зелёные - условие merge);
      # здесь gc-vs-Tcl крэш windows-runner'а воспроизводится нестабильно - не гоняем
      - run: pyinstaller ${{ matrix.args }} tgproxy_gui.py
      - name: Rename artifact
        shell: bash
        run: |
          if [ -f dist/tgproxy_gui.exe ]; then mv dist/tgproxy_gui.exe dist/${{ matrix.artifact }};
          else mv dist/tgproxy_gui dist/${{ matrix.artifact }}; fi
      - name: Smoke-тест бинаря (--self-test)
        shell: bash
        run: ./dist/${{ matrix.artifact }} --self-test
      - name: Аттестация провенанса сборки
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ matrix.artifact }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/${{ matrix.artifact }}
