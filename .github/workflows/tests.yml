name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  coverage:
    # gate 95% (из pytest.ini) применяется в этой джобе: на Windows нет
    # Tcl-крэша, который валит linux-прогон без --forked
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "mtproxy-checker @ git+https://github.com/alimghmi/mtproxychecker.git" pytest pytest-cov
      - run: python -m pytest -q
  unix:
    # кроссплатформенность: Tcl 8.6 на linux роняет интерпретатор при gc
    # в потоках воркера на фоне Tk, поэтому тесты форкаются в отдельные процессы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "mtproxy-checker @ git+https://github.com/alimghmi/mtproxychecker.git" pytest pytest-forked
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: xvfb-run -a python -m pytest -q --forked -o addopts=''
  commits:
    # формат сообщений коммитов: Conventional Commits (канон в AGENTS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Проверить сообщения коммитов
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then RANGE="$PR_BASE..$PR_HEAD"; else RANGE="$BEFORE..$SHA"; fi
          python3 ci/check_commit_messages.py "$RANGE"
