name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mtproxy-checker @ git+https://github.com/alimghmi/mtproxychecker.git" pytest pytest-cov
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: xvfb-run -a env PYTHONMALLOC=malloc python -m pytest -q
